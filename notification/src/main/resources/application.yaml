#service name
spring:
  application:
    name: notification-service
  # 1. Database Connection Settings
  datasource:
    url: jdbc:mysql://localhost:3306/notificationdb_yt?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 2. JPA / Hibernate Configurations
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  #3 configuration for rabbitmq
  rabbitmq:
    port: 5672
    host: localhost
    username: guest
    password: guest

server:
  port: 5008

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: "http://localhost:8070/eureka/"
