services:

  userdb:
    image: mysql
    container_name: userdb
    ports:
      - 3301:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping","-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: userdb
    networks:
      - salon_booking_backend

  bookingdb:
    image: mysql
    container_name: bookingdb
    ports:
      - 3302:3306
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping","-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookingdb
    networks:
      - salon_booking_backend

  categorydb:
    image: mysql
    container_name: categorydb
    ports:
      - 3303:3306
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping","-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: categorydb
    networks:
      - salon_booking_backend

  paymentdb:
    image: mysql
    container_name: paymentdb
    ports:
      - 3304:3306
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping","-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: paymentdb
    networks:
      - salon_booking_backend

  salondb:
    image: mysql
    container_name: salondb
    ports:
      - 3305:3306
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping","-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: salondb
    networks:
      - salon_booking_backend

  service-offeringdb:
    image: mysql
    container_name: service-offeringdb
    ports:
      - 3307:3306
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping","-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: service-offeringdb
    networks:
      - salon_booking_backend

  eurekaserver:
    image: "kittiphatduang1/salon-eurekaserver-yt:v1"
    ports:
      - "8070:8070"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://eurekaserver:8070/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    container_name: eurekaserver
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - salon_booking_backend

  user:
    image: "kittiphatduang1/salon-user-yt:v1"
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://user:5001/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    container_name: user
    depends_on:
      eurekaserver:
        condition: service_healthy
      userdb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "user-service"
      SPRING_DATASOURCE_URL: "jdbc:mysql://userdb:3306/userdb"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - salon_booking_backend

  booking:
    image: "kittiphatduang1/salon-booking-yt:v1"
    ports:
      - "5005:5005"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://booking:5005/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    container_name: booking
    depends_on:
      eurekaserver:
        condition: service_healthy
      bookingdb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "booking-service"
      SPRING_DATASOURCE_URL: "jdbc:mysql://bookingdb:3306/bookingdb"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - salon_booking_backend

  category:
    image: "kittiphatduang1/salon-category-yt:v1"
    ports:
      - "5003:5003"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://category:5003/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    container_name: category
    depends_on:
      eurekaserver:
        condition: service_healthy
      categorydb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "category-service"
      SPRING_DATASOURCE_URL: "jdbc:mysql://categorydb:3306/categorydb"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - salon_booking_backend

  payment:
    image: "kittiphatduang1/salon-payment-yt:v1"
    ports:
      - "5006:5006"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://payment:5006/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    container_name: payment
    depends_on:
      eurekaserver:
        condition: service_healthy
      paymentdb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "payment-service"
      SPRING_DATASOURCE_URL: "jdbc:mysql://paymentdb:3306/paymentdb"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - salon_booking_backend

  salon:
    image: "kittiphatduang1/salon-yt:v1"
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://salon:5002/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    container_name: salon
    depends_on:
      eurekaserver:
        condition: service_healthy
      salondb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "salon-service"
      SPRING_DATASOURCE_URL: "jdbc:mysql://salondb:3306/salondb"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - salon_booking_backend

  service-offering:
    image: "kittiphatduang1/salon-service-offering-yt:v1"
    ports:
      - "5004:5004"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://service-offering:5004/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    container_name: service-offering
    depends_on:
      eurekaserver:
        condition: service_healthy
      service-offeringdb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "offering-service"
      SPRING_DATASOURCE_URL: "jdbc:mysql://service-offeringdb:3306/service-offeringdb"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - salon_booking_backend

  gatewayserver:
    image: "kittiphatduang1/salon-gatewayserver-yt:v1"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://gatewayserver:5000/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    container_name: gatewayserver
    depends_on:
      eurekaserver:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "gateway-server"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eurekaserver:8070/eureka/"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - salon_booking_backend

networks:
  salon_booking_backend:
    driver: "bridge"