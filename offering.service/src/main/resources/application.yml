# service name
spring:
  application:
    name: offering-service
  # 1. Database Connection Settings
  datasource:
    url: jdbc:mysql://localhost:3306/servicesdb_yt?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 2. JPA / Hibernate Configurations
  jpa:
    show-sql: true

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# server port
server:
  port: 5004

# eureka configuration
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: "http://localhost:8070/eureka/"

